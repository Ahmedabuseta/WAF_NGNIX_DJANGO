<script>
// Mobile Navigation Controller
class MobileNavigation {
    constructor() {
        this.overlay = document.getElementById('mobile-nav-overlay');
        this.menu = document.getElementById('mobile-nav-menu');
        this.closeBtn = document.getElementById('mobile-nav-close');
        this.toggleBtn = document.getElementById('sidebar-toggle');
        
        this.init();
    }
    
    init() {
        // Close button
        if (this.closeBtn) {
            this.closeBtn.addEventListener('click', () => this.close());
        }
        
        // Overlay click
        if (this.overlay) {
            this.overlay.addEventListener('click', () => this.close());
        }
        
        // Toggle button
        if (this.toggleBtn) {
            this.toggleBtn.addEventListener('click', () => this.toggle());
        }
        
        // Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && this.isOpen()) {
                this.close();
            }
        });
        
        // Resize handler
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768 && this.isOpen()) {
                this.close();
            }
        });
    }
    
    toggle() {
        if (this.isOpen()) {
            this.close();
        } else {
            this.open();
        }
    }
    
    open() {
        if (this.overlay) this.overlay.classList.remove('hidden');
        if (this.menu) this.menu.classList.remove('-translate-x-full');
        document.body.classList.add('overflow-hidden');
    }
    
    close() {
        if (this.overlay) this.overlay.classList.add('hidden');
        if (this.menu) this.menu.classList.add('-translate-x-full');
        document.body.classList.remove('overflow-hidden');
    }
    
    isOpen() {
        return this.menu && !this.menu.classList.contains('-translate-x-full');
    }
}

// Initialize mobile navigation
document.addEventListener('DOMContentLoaded', function() {
    new MobileNavigation();
});
</script>
