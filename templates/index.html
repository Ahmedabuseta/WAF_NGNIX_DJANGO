{% extends 'ui/base.html' %}

{% block page_title %}Django + Flowbite{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold mb-4">Django + Flowbite is ready</h1>
      <p class="mb-6">This page uses Tailwind CDN and Flowbite scripts for quick validation.</p>

      <!-- Flowbite modal example -->
      <button data-modal-target="exampleModal" data-modal-toggle="exampleModal" class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5">Open modal</button>

      <div id="exampleModal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
        <div class="relative p-4 w-full max-w-md max-h-full">
          <div class="relative bg-white rounded-lg shadow">
            <div class="flex items-center justify-between p-4 border-b rounded-t">
              <h3 class="text-xl font-semibold">Flowbite Modal</h3>
              <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ml-auto inline-flex justify-center items-center" data-modal-hide="exampleModal">
                <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/></svg>
                <span class="sr-only">Close</span>
              </button>
            </div>
            <div class="p-4 space-y-4">
              <p>Flowbite JS is working if this modal opens and closes.</p>
            </div>
            <div class="flex items-center p-4 border-t border-gray-200 rounded-b">
              <button data-modal-hide="exampleModal" type="button" class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">OK</button>
            </div>
          </div>
        </div>
      </div>
{% endblock %}
